workflows:
    sample-workflow:
        name: Codemagic Sample Workflow
        max_build_duration: 120
        instance_type: mac_mini_m2

scripts:
      - name: Build Android
        script: flutter build apk --release # Example for Flutter
      - name: Build iOS
        script: flutter build ipa --release --no-codesign # Example for Flutter

artifacts:
  - build/app/outputs/flutter-apk/*-release.apk
  - build/ios/ipa/*.ipa

